        const inputNome = document.getElementById('nomePessoa');
        const inputTitulo = document.getElementById('tituloTrabalho');
        const inputHoras = document.getElementById('cargaHoraria');
        const campoTituloPalestra = document.getElementById('campoTituloPalestra');
        const campoCargaHoraria = document.getElementById('campoCargaHoraria');
        const labelNome = document.getElementById('labelNome');
        const autocompleteList = document.getElementById('autocompleteList');

        const logoBadgePadrao = document.getElementById('logoBadgePadrao');
        const logoImagem = document.getElementById('logoImagem');

        function configurarLogoFixo() {
            if (LOGO_SRC && LOGO_SRC.trim() !== '') {
                logoImagem.src = LOGO_SRC;
                logoImagem.classList.remove('hidden');
                logoBadgePadrao.classList.add('hidden');
            } else {
                tratarErroImagem();
            }
        }

        function tratarErroImagem() {
            // Em caso de caminho não encontrado, exibe o selo tradicional FCI
            logoImagem.classList.add('hidden');
            logoBadgePadrao.classList.remove('hidden');
        }

        const displayTituloCertificado = document.getElementById('displayTituloCertificado');
        const displayPreambulo = document.getElementById('displayPreambulo');
        const displayNome = document.getElementById('displayNome');
        const displayTextoCorpo = document.getElementById('displayTextoCorpo');
        const displayHorasTexto = document.getElementById('displayHorasTexto');

        const btnModParticipante = document.getElementById('btnModParticipante');
        const btnModPalestrante = document.getElementById('btnModPalestrante');
        const btnModMonitor = document.getElementById('btnModMonitor');

        function mudarModalidade(mod) {
            modalidadeAtual = mod;
            
            // Atualiza botões
            [btnModParticipante, btnModPalestrante, btnModMonitor].forEach(btn => {
                btn.className = "py-2 text-xs font-semibold rounded-md transition text-slate-600 hover:text-slate-900 hover:bg-slate-200/60";
            });

            if (mod === 'participante') {
                btnModParticipante.className = "py-2 text-xs font-semibold rounded-md transition text-white bg-red-600 shadow-sm";
                labelNome.innerText = "Nome completo do participante";
                campoTituloPalestra.classList.add('hidden');
                campoCargaHoraria.classList.remove('hidden');
                inputNome.placeholder = "Ex: Juliana Maria de Souza";
            } else if (mod === 'palestrante') {
                btnModPalestrante.className = "py-2 text-xs font-semibold rounded-md transition text-white bg-red-600 shadow-sm";
                labelNome.innerText = "Nome completo do palestrante";
                campoTituloPalestra.classList.remove('hidden');
                campoCargaHoraria.classList.add('hidden');
                inputNome.placeholder = "Ex: André Cândido Ubriaco de Oliveira";
            } else if (mod === 'monitor') {
                btnModMonitor.className = "py-2 text-xs font-semibold rounded-md transition text-white bg-red-600 shadow-sm";
                labelNome.innerText = "Nome completo do(a) monitor(a)";
                campoTituloPalestra.classList.add('hidden');
                campoCargaHoraria.classList.remove('hidden');
                inputNome.placeholder = "Ex: Regina Borovac";
            }

            autocompleteList.classList.add('hidden');
            gerar();
        }

        function gerar() {
            const nome = inputNome.value.trim();
            const horas = inputHoras.value || "30";
            const titulo = inputTitulo.value.trim();

            if (modalidadeAtual === 'participante') {
                displayTituloCertificado.innerText = "Certificado de Participação";
                displayPreambulo.innerText = "Certificamos que, para os devidos fins, o(a) aluno(a)";
                displayNome.innerText = nome || "[Nome do Participante]";
                displayTextoCorpo.innerHTML = `participou da <b>XIII Semana de Estudos da Faculdade Cultura Inglesa</b>, contemplando palestras magnas, oficinas pedagógicas, mesas-redondas e sessões de comunicação científica, realizada entre <b>20 e 24 de outubro de 2026</b>, com carga horária total de <b>${horas} horas</b>.`;
            } else if (modalidadeAtual === 'palestrante') {
                displayTituloCertificado.innerText = "Certificado de Palestrante";
                displayPreambulo.innerText = "Certificamos que, para os devidos fins,";
                displayNome.innerText = nome || "[Nome do Palestrante]";
                const tituloFormatado = titulo ? `apresentando a palestra/comunicação intitulada <i>"${titulo}"</i>,` : `apresentando discussões e trabalhos acadêmicos,`;
                displayTextoCorpo.innerHTML = `contribuiu como <b>palestrante</b> na <b>XIII Semana de Estudos da Faculdade Cultura Inglesa</b>, ${tituloFormatado} realizada entre <b>20 e 24 de outubro de 2026</b>.`;
            } else if (modalidadeAtual === 'monitor') {
                displayTituloCertificado.innerText = "Certificado de Monitoria";
                displayPreambulo.innerText = "Certificamos que, para os devidos fins, o(a) aluno(a)";
                displayNome.innerText = nome || "[Nome do(a) Monitor(a)]";
                displayTextoCorpo.innerHTML = `atuou como <b>Monitor(a)</b> na <b>XIII Semana de Estudos da Faculdade Cultura Inglesa</b>, apoiando as atividades acadêmicas, transmissões online e mediação de salas, realizada entre <b>20 e 24 de outubro de 2026</b>, com carga horária total de <b>${horas} horas</b>.`;
            }
        }

        function filtrarNomes() {
            const query = inputNome.value.toLowerCase().trim();
            if (!query) {
                autocompleteList.classList.add('hidden');
                autocompleteList.innerHTML = '';
                gerar();
                return;
            }

            let resultados = [];

            if (modalidadeAtual === 'participante') {
                resultados = baseDados.participantes
                    .filter(n => n.toLowerCase().includes(query))
                    .map(n => ({ nome: n, extra: "Inscrito FCI" }));
            } else if (modalidadeAtual === 'palestrante') {
                resultados = baseDados.palestrantes
                    .filter(p => p.nome.toLowerCase().includes(query))
                    .map(p => ({ nome: p.nome, extra: p.titulo }));
            } else if (modalidadeAtual === 'monitor') {
                resultados = baseDados.monitores
                    .filter(m => m.toLowerCase().includes(query))
                    .map(m => ({ nome: m, extra: "Comissão / Monitoria" }));
            }

            if (resultados.length === 0) {
                autocompleteList.classList.add('hidden');
                autocompleteList.innerHTML = '';
            } else {
                autocompleteList.innerHTML = resultados.slice(0, 6).map(item => `
                    <div 
                        onclick="selecionarSugestao('${item.nome.replace(/'/g, "\\'")}', '${(item.extra || '').replace(/'/g, "\\'")}')" 
                        class="px-3.5 py-2 hover:bg-red-50 hover:text-red-700 cursor-pointer border-b border-slate-100 last:border-none flex flex-col justify-start text-left"
                    >
                        <span class="font-medium text-slate-800">${item.nome}</span>
                        ${item.extra ? `<span class="text-[11px] text-slate-400 truncate">${item.extra}</span>` : ''}
                    </div>
                `).join('');
                autocompleteList.classList.remove('hidden');
            }

            gerar();
        }

        function selecionarSugestao(nome, extra) {
            inputNome.value = nome;
            if (modalidadeAtual === 'palestrante' && extra && extra !== "Inscrito FCI") {
                inputTitulo.value = extra;
            }
            autocompleteList.classList.add('hidden');
            autocompleteList.innerHTML = '';
            gerar();
        }

        // Fechar autocomplete ao clicar fora
        document.addEventListener('click', function(e) {
            if (!inputNome.contains(e.target) && !autocompleteList.contains(e.target)) {
                autocompleteList.classList.add('hidden');
            }
        });

        // Inicialização
        window.onload = function() {
            configurarLogoFixo();
            gerar();
        };
    </script>
</body>
</html>


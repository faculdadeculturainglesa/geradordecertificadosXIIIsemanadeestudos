
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Certificados - XIII Semana de Estudos FCI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { 
                background: white !important; 
                margin: 0 !important;
                padding: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            @page { 
                size: landscape; 
                margin: 0; 
            }
            #printable-area {
                margin: 0 !important;
                box-shadow: none !important;
                max-width: 100% !important;
                width: 100vw !important;
                height: 100vh !important;
                border: none !important;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
        .cert-bg {
            background-color: #fff;
            background-image: radial-gradient(#dc2626 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            opacity: 0.05;
        }
        .signature-container {
            position: relative;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Estilo idêntico para a assinatura em texto cursivo */
        .signature-text {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #1e293b;
            user-select: none;
        }
        /* Custom scrollbar para lista de sugestões */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f8fafc;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-100 font-['Poppins'] min-h-screen py-8 px-4 flex flex-col justify-between">

    <!-- Painel de Controle (Fiel ao modelo, com suporte a modalidades e autocompletar) -->
    <div class="no-print max-w-2xl mx-auto w-full bg-white rounded-xl shadow-lg border-t-4 border-red-600 p-6 mb-8 transition-all">
        <div class="flex items-center justify-between mb-2">
            <h1 class="text-xl font-bold text-slate-800">Gerador de Certificado - XIII Semana de Estudos FCI</h1>
            <span class="text-xs font-semibold px-2.5 py-1 bg-red-100 text-red-700 rounded-full">FCI 2026</span>
        </div>
        <p class="text-xs md:text-sm text-slate-500 mb-4 font-semibold">
            ✨ Selecione a modalidade, digite o nome completo e clique em <b>Gerar Certificado</b> ou <b>Imprimir / Salvar PDF</b>.
        </p>

        <!-- Seletor de Modalidade (Participante, Palestrante, Monitoria) -->
        <div class="grid grid-cols-3 gap-2 mb-4 bg-slate-50 p-1.5 rounded-lg border border-slate-200">
            <button 
                type="button"
                id="btnModParticipante" 
                onclick="mudarModalidade('participante')"
                class="py-2 text-xs font-semibold rounded-md transition text-white bg-red-600 shadow-sm"
            >
                Participante
            </button>
            <button 
                type="button"
                id="btnModPalestrante" 
                onclick="mudarModalidade('palestrante')"
                class="py-2 text-xs font-semibold rounded-md transition text-slate-600 hover:text-slate-900 hover:bg-slate-200/60"
            >
                Palestrante
            </button>
            <button 
                type="button"
                id="btnModMonitor" 
                onclick="mudarModalidade('monitor')"
                class="py-2 text-xs font-semibold rounded-md transition text-slate-600 hover:text-slate-900 hover:bg-slate-200/60"
            >
                Monitoria
            </button>
        </div>

        <!-- Input com Autocomplete -->
        <div class="relative mb-3">
            <label id="labelNome" for="nomePessoa" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                Nome completo do participante
            </label>
            <input 
                type="text" 
                id="nomePessoa" 
                placeholder="Ex: Juliana Maria de Souza" 
                autocomplete="off"
                oninput="filtrarNomes()"
                class="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-red-500 focus:bg-white text-slate-800 text-sm font-medium transition"
            >
            <div id="autocompleteList" class="hidden absolute z-30 left-0 right-0 mt-1 max-h-48 bg-white border border-slate-200 rounded-lg shadow-xl overflow-y-auto custom-scroll text-sm"></div>
        </div>

        <!-- Campo adicional para Palestrante (Título da Apresentação / Palestra) -->
        <div id="campoTituloPalestra" class="hidden mb-3">
            <label for="tituloTrabalho" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                Título da Palestra ou Trabalho Apresentado
            </label>
            <input 
                type="text" 
                id="tituloTrabalho" 
                placeholder="Ex: From Corpus Evidence to Classroom Inquiry: Fair Cloze Lab" 
                class="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-red-500 focus:bg-white text-slate-800 text-sm font-medium transition"
                oninput="gerar()"
            >
        </div>

        <!-- Carga Horária -->
        <div id="campoCargaHoraria" class="mb-4">
            <label for="cargaHoraria" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                Carga Horária (Horas)
            </label>
            <input 
                type="number" 
                id="cargaHoraria" 
                value="30" 
                min="1" 
                max="120"
                class="w-32 p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-red-500 focus:bg-white text-slate-800 text-sm font-semibold transition"
                oninput="gerar()"
            >
        </div>

        <!-- Botões de Ação Idênticos aos Modelos Fornecidos -->
        <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-100">
            <button onclick="gerar()" class="bg-slate-800 text-white px-6 py-2.5 rounded-lg hover:bg-slate-900 active:scale-95 transition text-sm font-medium">
                Gerar Certificado
            </button>
            <button onclick="window.print()" class="bg-red-600 text-white px-6 py-2.5 rounded-lg hover:bg-red-700 active:scale-95 transition text-sm font-medium flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                Imprimir / Salvar PDF
            </button>
        </div>
    </div>

    <!-- Área Oficial do Certificado (Fiel aos arquivos certificadoparticipantes.html, certificadopalestrante.html e certificado_monitores.html) -->
    <div class="w-full flex justify-center items-center pb-8">
        <div id="printable-area" class="w-full max-w-[1000px] mx-auto p-1 bg-white shadow-2xl relative transition-all">
            <div class="border-8 border-slate-800 p-10 sm:p-12 relative min-h-[640px] flex flex-col justify-between">
                
                <!-- Background Pattern idêntico ao modelo (.cert-bg) -->
                <div class="absolute inset-0 cert-bg pointer-events-none"></div>
                
                <div class="relative z-10 text-center flex-1 flex flex-col justify-between">
                    
                    <!-- Topo Institucional -->
                    <div>
                        <!-- Espaço do Logotipo / Imagem Institucional Fixa no Código -->
                        <div class="flex justify-center mb-5 min-h-[56px] items-center">
                            <div id="containerLogo">
                                <!-- Coloque o link direto da imagem no GitHub no atributo 'src' abaixo -->
                                <img 
                                    id="logoImagem" 
                                    src="logo.jpg" 
                                    alt="Logo Faculdade Cultura Inglesa" 
                                    class="max-h-20 max-w-[240px] object-contain mx-auto"
                                    onerror="tratarErroImagem()"
                                >
                                <!-- Fallback automático caso a imagem ainda não exista no repositório -->
                                <div id="logoBadgePadrao" class="hidden bg-red-600 text-white p-3 rounded-lg font-bold text-2xl shadow-sm">
                                    FCI
                                </div>
                            </div>
                        </div>

                        <h2 class="text-slate-500 uppercase tracking-[0.3em] text-xs sm:text-sm font-bold mb-2">Faculdade Cultura Inglesa</h2>
                        
                        <!-- Título do Certificado Dinâmico (Participação / Palestrante / Monitoria) -->
                        <h1 id="displayTituloCertificado" class="font-['Playfair_Display'] text-3xl sm:text-4xl text-slate-800 mb-8 italic">
                            Certificado de Participação
                        </h1>
                        
                        <p id="displayPreambulo" class="text-base sm:text-lg text-slate-600 mb-6">
                            Certificamos que, para os devidos fins, o(a) aluno(a)
                        </p>
                        
                        <!-- Nome da Pessoa em Destaque -->
                        <h3 id="displayNome" class="text-2xl sm:text-3xl font-bold text-red-600 mb-6 border-b-2 border-slate-100 inline-block px-6 sm:px-10 pb-2 max-w-full break-words">
                            [Nome do Participante]
                        </h3>
                    </div>

                    <!-- Texto Oficial da XIII Semana de Estudos FCI -->
                    <div class="my-auto py-2">
                        <p id="displayTextoCorpo" class="text-base sm:text-lg text-slate-600 max-w-2xl mx-auto leading-relaxed">
                            participou da <b>XIII Semana de Estudos da Faculdade Cultura Inglesa</b>, contemplando palestras magnas, oficinas pedagógicas, mesas-redondas e sessões de comunicação científica, realizada entre <b>20 e 24 de outubro de 2026</b>, com carga horária total de <b><span id="displayHorasTexto">30</span> horas</b>.
                        </p>
                    </div>

                    <!-- Bloco da Assinatura e Data de Emissão (Seguindo a estrutura dos modelos) -->
                    <div class="mt-8">
                        <div class="flex justify-center">
                            <div class="text-center w-80">
                                <div class="signature-container mb-2">
                                    <span class="signature-text">Cassia C Venezuela</span>
                                </div>
                                <div class="border-t border-slate-400 pt-2 text-sm text-slate-500">
                                    <b>Prof.ª Dra. Cassia Cristina Marques Venezuela</b><br>Coordenação Geral
                                </div>
                            </div>
                        </div>

                        <div class="mt-10 text-[10px] sm:text-xs text-slate-400 uppercase tracking-widest">
                            São Paulo, 24 de outubro de 2026
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts com Banco de Dados e Lógica de Atualização -->
